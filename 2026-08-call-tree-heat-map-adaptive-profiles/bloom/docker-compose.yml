name: bloom-0826

x-telemetry-env: &telemetry-env
  PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
  PYROSCOPE_BASIC_AUTH_USER: ${PYROSCOPE_BASIC_AUTH_USER:-}
  PYROSCOPE_BASIC_AUTH_PASSWORD: ${PYROSCOPE_BASIC_AUTH_PASSWORD:-}
  PYROSCOPE_FORMAT: jfr
  PYROSCOPE_PROFILER_EVENT: itimer
  PYROSCOPE_PROFILER_ALLOC: 512k
  PYROSCOPE_PROFILER_LOCK: 1ms
  PYROSCOPE_ALLOC_LIVE: ${PYROSCOPE_ALLOC_LIVE:-true}
  PYROSCOPE_UPLOAD_INTERVAL: 15s
  PYROSCOPE_LABELS: ${PYROSCOPE_LABELS:-env=demo,namespace=bloom}
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=bloom,deployment.environment=demo
  OTEL_PYROSCOPE_START_PROFILING: "false"
  OTEL_PYROSCOPE_ADD_PROFILE_URL: "false"
  OTEL_PYROSCOPE_ADD_PROFILE_BASELINE_URL: "false"

x-healthcheck: &java-healthcheck
  interval: 5s
  timeout: 3s
  retries: 40
  start_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bloom
      POSTGRES_PASSWORD: bloom
      POSTGRES_DB: bloom
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloom"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      args: { MODULE: gateway }
    image: bloom/gateway
    ports:
      - "8080:8080"
    environment:
      <<: *telemetry-env
      PYROSCOPE_APPLICATION_NAME: bloom-gateway
      OTEL_SERVICE_NAME: bloom-gateway
      CATALOG_URL: http://catalog:8081
      PRICING_URL: http://pricing:8082
      ORDERS_URL: http://orders:8083
    depends_on:
      catalog: { condition: service_healthy }
      pricing: { condition: service_healthy }
      orders: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]

  catalog:
    build:
      context: .
      args: { MODULE: catalog }
    image: bloom/catalog
    ports:
      - "8081:8081"
    environment:
      <<: *telemetry-env
      PYROSCOPE_APPLICATION_NAME: bloom-catalog
      OTEL_SERVICE_NAME: bloom-catalog
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_USERNAME: bloom
      SPRING_DATASOURCE_PASSWORD: bloom
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]

  pricing:
    build:
      context: .
      args: { MODULE: pricing }
    image: bloom/pricing
    ports:
      - "8082:8082"
    environment:
      <<: *telemetry-env
      PYROSCOPE_APPLICATION_NAME: bloom-pricing
      OTEL_SERVICE_NAME: bloom-pricing
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]

  orders:
    build:
      context: .
      args: { MODULE: orders }
    image: bloom/orders
    ports:
      - "8083:8083"
    environment:
      <<: *telemetry-env
      PYROSCOPE_APPLICATION_NAME: bloom-orders
      OTEL_SERVICE_NAME: bloom-orders
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: bloom
      SPRING_DATASOURCE_PASSWORD: bloom
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]

  k6:
    image: grafana/k6:2.2.0
    command: ["run", "/scripts/checkout-flow.js"]
    restart: unless-stopped
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE_URL: http://gateway:8080
      API_KEY: bloom-demo-key
      DURATION: ${LOAD_DURATION:-12h}
      CHECKOUT_RATE: ${CHECKOUT_RATE:-6}
    depends_on:
      gateway: { condition: service_healthy }

  # SelectHeatmap, which backs the heatmap query option, is only served by the
  # v2 read path, so the v1-v2-dual default is not enough here.
  pyroscope:
    image: grafana/pyroscope:2.2.1
    command:
      - "-config.file=/etc/pyroscope/config.yaml"
      - "-architecture.storage=v2"
    ports:
      - "4040:4040"

  tempo:
    image: grafana/tempo:3.0.2
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"

  # Profiles Drilldown (grafana-pyroscope-app) ships preinstalled and is the
  # surface both demoed features live on. It registers its own OpenFeature
  # provider, so the toggles below resolve for anonymous visitors too.
  #
  # The login form stays enabled: core Explore reads the Call Tree flag through
  # Grafana's own OpenFeature client, which is only initialized for a signed-in
  # user, so the tab is missing there until you sign in as admin / bloom.
  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      # Not "admin": that value makes the login form force a password change.
      GF_SECURITY_ADMIN_PASSWORD: bloom
      GF_FEATURE_TOGGLES_ENABLE: flameGraphWithCallTree profilesHeatmap
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - pyroscope
      - tempo

volumes:
  pgdata:
  tempodata:
