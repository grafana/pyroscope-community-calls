server:
  port: 8083

spring:
  application:
    name: orders
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:bloom}
    password: ${SPRING_DATASOURCE_PASSWORD:bloom}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true

bloom:
  audit:
    path: ${BLOOM_AUDIT_PATH:/tmp/bloom-audit.log}
